services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: pos_backend
      POSTGRES_USER: pos_migrator
      POSTGRES_PASSWORD: pos_migrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_migrator -d pos_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
